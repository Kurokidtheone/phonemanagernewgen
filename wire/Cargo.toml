[package]
name = "wire"
version.workspace = true
edition.workspace = true
description = "End-to-end encrypted message format between the phone and the shop PC"

[dependencies]
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
