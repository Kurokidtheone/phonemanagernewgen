name: Build Windows and macOS installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  # Whether the Android signing secrets are set. Without them the installer is built without the phone app.
  signing:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are not set: the installer is built without the phone app (/app.apk). See mobile-apk.yml."
          fi
  # The signed phone app, packed into the installer so the PC can hand it out at /app.apk.
  apk:
    needs: signing
    if: needs.signing.outputs.ready == 'true'
    uses: ./.github/workflows/mobile-apk.yml
    secrets: inherit
  build:
    needs: [signing, apk]
    # Runs when the APK was built, or skipped for lack of secrets; not when its build failed.
    if: ${{ !cancelled() && needs.signing.result == 'success' && (needs.apk.result == 'success' || needs.apk.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        if: needs.apk.result == 'success'
        with: { name: apk, path: apk }
      - name: Place the phone app where the installer packs it
        shell: bash
        run: |
          mkdir -p build/mobile
          if [ -f apk/build/mobile/app.apk ]; then cp apk/build/mobile/app.apk apk/build/mobile/app.json build/mobile/; fi
      - run: npm ci
      # Typecheck, lint, the window's tests and the Rust core's tests.
      - run: npm run check
      # Builds the window (vite) and the Tauri app, then packs the NSIS installer.
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: installer, path: target/release/bundle/nsis/*.exe }
      # A pushed tag (v1.0.0) also publishes the installer as a GitHub release.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: target/release/bundle/nsis/*.exe }
  # The macOS app: one universal .dmg for Intel and Apple Silicon Macs, from macOS 10.15 Catalina up.
  build-mac:
    needs: [signing, apk]
    if: ${{ !cancelled() && needs.signing.result == 'success' && (needs.apk.result == 'success' || needs.apk.result == 'skipped') }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Native code (SQLite, crypto) is compiled for the oldest supported macOS, not the runner's.
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        if: needs.apk.result == 'success'
        with: { name: apk, path: apk }
      - name: Place the phone app where the bundle packs it
        run: |
          mkdir -p build/mobile
          if [ -f apk/build/mobile/app.apk ]; then cp apk/build/mobile/app.apk apk/build/mobile/app.json build/mobile/; fi
      - run: npm ci
      # Builds the window (vite) and the Tauri app for both CPUs, then packs the .app and the .dmg (ad-hoc signed).
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: target/universal-apple-darwin/release/bundle/dmg/*.dmg }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: target/universal-apple-darwin/release/bundle/dmg/*.dmg }
