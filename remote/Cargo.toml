[package]
name = "remote"
version.workspace = true
edition.workspace = true
description = "Client for the Supabase mailbox: five RPC functions plus Realtime wake-ups"

[features]
# In-process fake of the five Supabase functions and Realtime, for tests.
fake = ["dep:axum"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"], optional = true }
wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[dev-dependencies]
remote = { path = ".", features = ["fake"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net"] }
