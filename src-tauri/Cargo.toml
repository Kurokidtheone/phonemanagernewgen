[package]
name = "phone-store-manager"
version.workspace = true
edition.workspace = true
description = "Phone Store Manager: the Windows desktop app (Tauri 2)"
default-run = "phone-store-manager"

[lib]
name = "phone_store_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
psm-core = { path = "../core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Foundation", "Win32_System_WinRT"] }
windows-core = "0.62"
