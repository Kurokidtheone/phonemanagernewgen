[package]
name = "psm-core"
version.workspace = true
edition.workspace = true
description = "Phone Store Manager: database, services, API channels and the phone server (no UI)"

[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.5"

[dependencies]
wire = { path = "../wire" }
remote = { path = "../remote" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_rusqlite = "0.40"
ts-rs = "12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
scrypt = { version = "0.11", default-features = false }
subtle = "2"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
once_cell = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "fs"] }
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
hkdf = "0.12"
if-addrs = "0.13"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[dev-dependencies]
remote = { path = "../remote", features = ["fake"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tempfile = "3"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
